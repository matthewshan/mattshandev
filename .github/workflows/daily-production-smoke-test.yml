name: Daily Production Smoke Test

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to test"
        required: false
        default: "https://mattshan.dev"

jobs:
  smoke-test:
    name: Smoke test mattshan.dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BASE_URL: ${{ github.event.inputs.base_url || 'https://mattshan.dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright smoke test
        run: pnpm run test:e2e
