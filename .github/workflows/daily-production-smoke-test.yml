name: Daily Production Smoke Test

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to test"
        required: false
        default: "https://mattshan.dev"
      alert_email_to:
        description: "Optional override for the alert recipient email"
        required: false
        default: ""

jobs:
  smoke-test:
    name: Smoke test mattshan.dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BASE_URL: ${{ github.event.inputs.base_url || 'https://mattshan.dev' }}
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      ALERT_EMAIL_TO: ${{ github.event.inputs.alert_email_to || secrets.SMOKE_TEST_ALERT_EMAIL_TO }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright smoke test
        run: pnpm run test:e2e

      - name: Send failure email
        if: ${{ failure() && env.SMTP_SERVER != '' && env.SMTP_USERNAME != '' && env.SMTP_PASSWORD != '' && env.ALERT_EMAIL_TO != '' }}
        uses: dawidd6/action-send-mail@v16
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ env.SMTP_PORT || 587 }}
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: Daily smoke test failed for ${{ env.BASE_URL }}
          to: ${{ env.ALERT_EMAIL_TO }}
          from: ${{ env.SMTP_FROM || env.SMTP_USERNAME }}
          body: |
            The daily Playwright smoke test failed for ${{ env.BASE_URL }}.
            Repository: ${{ github.repository }}
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
